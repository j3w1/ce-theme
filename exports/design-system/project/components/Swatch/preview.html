<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Swatch</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ce-space-12); padding: var(--ce-space-16); }
</style>
</head>
<body>
<div class="ce-scope stage">
  <div class="ce-swatches" role="group" aria-label="Color">
    <button class="ce-swatch" type="button" aria-label="Blanco" aria-pressed="true" style="background: var(--ce-color-surface-canvas)"></button>
    <button class="ce-swatch" type="button" aria-label="Negro" aria-pressed="false" style="background: var(--ce-color-surface-inverse)"></button>
    <button class="ce-swatch" type="button" aria-label="Gris" aria-pressed="false" style="background: var(--ce-color-text-muted)"></button>
  </div>
</div>
</body>
</html>
