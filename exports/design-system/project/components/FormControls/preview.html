<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FormControls</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .wrap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ce-space-24) var(--ce-space-40); padding: var(--ce-space-16); align-items: start; }
</style>
</head>
<body>
<div class="ce-scope wrap">
  <div style="display:grid;gap:var(--ce-space-16)">
    <label class="ce-switch"><input type="checkbox" role="switch" checked>Publicar en la tienda</label>
    <label class="ce-check"><input type="checkbox" checked>Disponible en tu tienda</label>
    <div class="ce-field"><label for="amt">Precio de venta</label><div class="ce-input-group"><span class="ce-input-affix">S/</span><input class="ce-input ce-input--number" id="amt" inputmode="decimal" value="6.50"></div><span class="ce-field-note">Texto decimal; el sistema de precios lo valida.</span></div>
    <div class="ce-quantity"><button type="button" aria-label="Quitar uno"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14"/></svg></button><label class="ce-sr-only" for="qq">Cantidad</label><input id="qq" type="number" min="1" value="2"><button type="button" aria-label="Agregar uno"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button></div>
  </div>
  <div style="display:grid;gap:var(--ce-space-16)">
    <fieldset class="ce-fieldset"><legend>Materiales</legend><ul class="ce-token-list"><li class="ce-token">vidrio borosilicato<button type="button" aria-label="Quitar vidrio borosilicato"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button></li><li class="ce-token">bambú<button type="button" aria-label="Quitar bambú"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button></li></ul></fieldset>
    <label class="ce-upload"><input type="file" accept="image/*"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg><span><strong>Elige una foto</strong> o arrástrala aquí</span><span>PNG o JPG, fondo blanco</span></label>
    <fieldset class="ce-choice-cards"><legend class="ce-sr-only">Entrega</legend><label class="ce-choice-card"><input type="radio" name="x" checked><span class="ce-choice-card-title">Retiro en tienda</span><span>Sin costo</span></label><label class="ce-choice-card"><input type="radio" name="x" disabled><span class="ce-choice-card-title">Retiro por otra persona</span><span>No disponible todavía</span></label></fieldset>
  </div>
</div>
</body>
</html>
