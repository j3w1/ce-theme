<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Callout</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ce-space-12); padding: var(--ce-space-16); }
  .stage-callout { padding: var(--ce-space-24); background: var(--ce-color-brand-yellow); }
  .ce-callout { max-width: 420px; }
</style>
</head>
<body>
<div class="ce-scope stage-callout">
  <article class="ce-callout">
    <img src="../../media/product-nome.png" alt="Taza NOME de vidrio" width="300" height="300">
    <div>
      <span class="ce-code">CE26061440</span>
      <h3>Taza de vidrio</h3>
      <p class="ce-product-details">350ml · vidrio borosilicato</p>
      <div class="ce-price-block"><span class="ce-price ce-price--regular"><span class="ce-sr-only">Precio actual: 8 soles, cada una</span><span class="ce-price-currency" aria-hidden="true">S/</span><span class="ce-price-value" aria-hidden="true">8</span><span class="ce-price-unit" aria-hidden="true">cada una</span></span></div>
    </div>
  </article>
</div>
</body>
</html>
