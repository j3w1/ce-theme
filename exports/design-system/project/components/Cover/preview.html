<!-- @dsCard height=288 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Casa Elida</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ce-color-surface-canvas); color: var(--ce-color-text-primary); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; }
  .art svg { display: block; width: 480px; height: 288px; }
  .red { fill: var(--ce-color-brand-red); }
  .yellow { fill: var(--ce-color-brand-yellow); }
  .ink { fill: var(--ce-color-code-bg); }
  .glyph { fill: var(--ce-color-price-offer-text); font-family: var(--font-sans); font-weight: 800; letter-spacing: -0.045em; }
  .square { rx: var(--ce-radius-none); }
  .words { position: absolute; left: var(--ce-space-48); bottom: var(--ce-space-32); max-width: 440px; }
  .name { margin: 0; font-size: 104px; line-height: .95; font-weight: 800; letter-spacing: -0.045em; }
  .tag { margin: var(--ce-space-12) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ce-color-text-muted); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      brand-red 224×288 full-height slab (the brand's ground, largest) · brand-yellow 240×208 bleeding off the right and bottom (offer yellow) · code-bg ink 144×32 bar (the product-code label) — about 36% of 960×288
        arrangement one tall red slab with yellow and ink satellites, square corners, space-16 gutters
        pattern     one oversized numerals glyph, from “the price is the largest type”: the heavy S/ in price-offer-text ink, clipped by the yellow block like an offer price
        scales      sides in space-16 multiples; gutters space-16; code bar space-32 tall; every corner radius-none
      -->
      <defs><clipPath id="offer"><rect x="240" y="80" width="240" height="208"/></clipPath></defs>
      <rect class="red square" x="0" y="0" width="224" height="288"/>
      <rect class="ink square" x="240" y="32" width="144" height="32"/>
      <rect class="yellow square" x="240" y="80" width="240" height="208"/>
      <text class="glyph" x="256" y="312" font-size="248" clip-path="url(#offer)">S/</text>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Casa<br>Elida</h1>
    <p class="tag">El buen gusto, no cuesta más.</p>
  </div>
</div>
</body>
</html>
