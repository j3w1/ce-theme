<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PhotoPanel</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .stage { display: flex; flex-wrap: wrap; align-items: center; gap: var(--ce-space-12); padding: var(--ce-space-16); }
  .panel { padding: var(--ce-space-16); }
  .ce-photo-panel { max-width: 560px; aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<div class="ce-scope panel">
  <article class="ce-photo-panel">
    <div class="ce-photo-content">
      <span class="ce-code">CE26061440</span>
      <h3>Taza de vidrio resistente al calor</h3>
      <p>Vidrio borosilicato, 350ml · Precio de ejemplo</p>
      <span class="ce-price ce-price--inverse"><span class="ce-sr-only">Precio actual: 8 soles</span><span class="ce-price-currency" aria-hidden="true">S/</span><span class="ce-price-value" aria-hidden="true">8</span></span>
    </div>
  </article>
</div>
</body>
</html>
