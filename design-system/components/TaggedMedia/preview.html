<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TaggedMedia</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .wrap { padding: var(--ce-space-16); }
  .scene { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; gap: var(--ce-space-16); aspect-ratio: 16 / 9; padding: var(--ce-space-24); background: var(--ce-color-surface-subtle); }
  .scene img { width: 100%; height: auto; }
  .note { margin: var(--ce-space-8) 0 0; color: var(--ce-color-text-muted); font-size: var(--ce-font-size-xs); }
</style>
</head>
<body>
<div class="ce-scope wrap">
  <figure class="ce-tagged-media" style="margin:0">
    <div class="scene" role="img" aria-label="Composición de ejemplo con dos tazas de vidrio y un tapete de ducha"><img src="../../media/product-mene.png" alt=""><img src="../../media/product-nome.png" alt=""><img src="../../media/product-tilen.png" alt=""></div>
    <a class="ce-hotspot" href="#mene" style="--ce-x:22%;--ce-y:34%"><span aria-hidden="true">A</span><span class="ce-sr-only">Producto A: MENE, Taza de Vidrio Resistente al Calor</span></a>
    <a class="ce-hotspot" href="#nome" style="--ce-x:52%;--ce-y:30%"><span aria-hidden="true">B</span><span class="ce-sr-only">Producto B: NOME, Taza de Vidrio Resistente al Calor</span></a>
    <a class="ce-hotspot" href="#tilen" style="--ce-x:80%;--ce-y:46%"><span aria-hidden="true">C</span><span class="ce-sr-only">Producto C: TILEN, Tapete de Ducha Antideslizante</span></a>
    <span class="ce-feature-tag ce-feature-tag--light" style="--ce-x:7%;--ce-y:72%;--ce-line:18px;--ce-tag-width:8em"><span class="ce-feature-tag-label">de <strong>vidrio borosilicato</strong></span></span>
    <span class="ce-feature-tag" style="--ce-x:69%;--ce-y:60%;--ce-line:16px;--ce-tag-width:10em"><span class="ce-feature-tag-label">base <strong>antideslizante</strong></span></span>
  </figure>
  <p class="note">Composición de ejemplo con fotos del catálogo.</p>
</div>
</body>
</html>
