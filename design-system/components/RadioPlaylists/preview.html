<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>RadioPlaylists</title>
<style>
  :root { --ce-chrome-height: 30px; }
  body { margin: 0; background: var(--ce-color-surface-canvas); font-family: var(--ce-font-family); }

    border: var(--ce-stroke-thin) solid var(--ce-color-border-default); background: var(--ce-color-surface-canvas);

  color: var(--ce-color-text-inverse); font-size: var(--ce-font-size-xs); line-height: 1; font-weight: var(--ce-font-weight-bold); }

  color: var(--ce-color-text-inverse); cursor: pointer; -webkit-app-region: no-drag; app-region: no-drag; transition: background-color var(--ce-motion-quick); }

.ce-chrome__button:hover:not(:disabled) { background: var(--ce-color-text-secondary); }

.ce-chrome__button:disabled { opacity: 0.45; cursor: default; }
.ce-chrome__button:focus-visible { outline: var(--ce-stroke-focus) solid var(--ce-color-text-inverse); outline-offset: -4px; }
.ce-player { position: relative; isolation: isolate; box-sizing: border-box; height: calc(100vh - var(--ce-chrome-height)); padding: 6px 14px 8px 6px;
  display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 10px; background: var(--ce-color-surface-canvas); color: var(--ce-color-text-primary); font-family: var(--ce-font-family); }
.ce-player[hidden] { display: none; }
.ce-player *, .ce-player *::before, .ce-player *::after { box-sizing: border-box; }
.ce-player .ce-icon-button { flex: none; min-height: 0; }

.ce-player .ce-icon-button svg { width: 20px; height: 20px; }
.ce-player__antenna { display: grid; place-items: center; min-height: 0; }

.ce-volume-tree__body { fill: var(--ce-color-status-success-bg); stroke: var(--ce-color-status-success-text); stroke-width: 1.3; stroke-linejoin: round; }

.ce-player__deck { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }

.ce-track-skip { position: relative; flex: none; display: grid; place-items: center; }

.ce-icon-button.ce-player__skip svg { width: 20px; height: 20px; }
.ce-track-skip__label { position: absolute; top: calc(100% + 4px); left: 50%; width: 80px; transform: translateX(-50%); display: grid; text-align: center;
  font-size: 10px; line-height: 12px; color: var(--ce-color-text-muted); pointer-events: auto; }
.ce-track-skip__title, .ce-track-skip__artist { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ce-track-skip__title { color: var(--ce-color-text-primary); font-weight: var(--ce-font-weight-semibold); }
.ce-track-skip__artist { color: var(--ce-color-text-muted); }
.ce-track-skip__artist:empty { display: none; }
.ce-track-skip__label.is-unknown .ce-track-skip__title { color: var(--ce-color-text-muted); font-weight: var(--ce-font-weight-regular); }
.ce-track-skip:has(.ce-player__skip:disabled) .ce-track-skip__label { opacity: 0.5; }
.ce-stage { position: relative; flex: none; height: 100%; max-height: 150px; aspect-ratio: 1; display: grid; place-items: center; }
.ce-player__logo { position: relative; z-index: 1; width: 82%; height: 82%; object-fit: contain; transition: transform 75ms ease-out, filter 100ms, opacity 300ms; }
.ce-player__logo, .ce-loader__logo { border-radius: 0; user-select: none; -webkit-user-drag: none; }
.ce-stage__ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.ce-stage__track { fill: none; stroke: var(--ce-color-border-default); stroke-width: 1.2; transition: stroke 300ms; }
.ce-stage__arc { fill: none; stroke: var(--ce-color-text-primary); stroke-width: 2; stroke-linecap: round; opacity: 0; transition: stroke-dashoffset 900ms linear, opacity 300ms; }
.ce-stage__ring.is-known .ce-stage__arc { opacity: 1; }
.ce-stage__spark { fill: var(--ce-color-text-primary); opacity: 0; transition: cx 900ms linear, cy 900ms linear, opacity 300ms; }
.ce-stage__wave { position: absolute; inset: 9%; border-radius: 50%; border: 1.5px solid var(--ce-color-text-primary); opacity: 0; pointer-events: none; }
.ce-stage__badge { position: absolute; z-index: 3; right: 6%; bottom: 8%; display: inline-grid; place-items: center; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%;
  background: var(--ce-color-surface-canvas); border: 1.5px solid var(--ce-color-border-control); color: var(--ce-color-text-secondary); }

.ce-stage[data-state="spot-on"] .ce-stage__wave { border-color: var(--ce-color-action-primary-bg); animation: ce-stage-wave 3s ease-out infinite; }

.ce-player .ce-status { justify-content: center; gap: 6px; min-width: 0; max-width: 100%; min-height: 24px; padding: 2px 10px; border-radius: var(--ce-radius-pill);
  background: var(--ce-color-surface-subtle); color: var(--ce-color-text-secondary); font-size: var(--ce-font-size-xs); line-height: 1.3; font-variant-numeric: tabular-nums; }

.ce-icon-button.ce-offline__retry { width: 52px; height: 52px; flex-basis: 52px; border-color: transparent; background: var(--ce-color-action-primary-bg); color: var(--ce-color-action-primary-text); }
