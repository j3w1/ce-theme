<!-- @dsCard group="Sharing" height=630 width=1200 subtitle="1200 × 630; centre square is the safe zone" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>ShareCard</title>
<style>
  html, body { margin: 0; background: var(--ce-color-surface-canvas); }
</style>
</head>
<body>
<div class="ce-scope">
  <article class="ce-share-card">
    <div class="ce-share-card-brand"><img src="../../media/logo-brand.jpg" alt="Casa Elida"></div>
    <div class="ce-share-card-square">
      <div class="ce-share-card-media"><img src="../../media/product-nome.png" alt="Taza de vidrio NOME"></div>
      <div class="ce-share-card-info">
        <h1 class="ce-share-card-name">Taza de vidrio resistente al calor NOME</h1>
        <div class="ce-price-block"><span class="ce-price ce-price--regular"><span class="ce-sr-only">Precio actual: 8 soles</span><span class="ce-price-currency" aria-hidden="true">S/</span><span class="ce-price-value" aria-hidden="true">8</span></span><p class="ce-share-card-details">Vidrio borosilicato, 350ml</p></div>
      </div>
    </div>
    <div class="ce-share-card-aside">
      <span class="ce-code">CE26061440</span>
      <span class="ce-share-card-url">casaelida.com</span>
    </div>
  </article>
</div>
</body>
</html>
