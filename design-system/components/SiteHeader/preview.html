<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>SiteHeader</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }

</style>
</head>
<body>
<div class="ce-scope">
  <div class="ce-utility-bar"><div class="ce-container ce-utility-bar-inner"><p>El buen gusto, no cuesta más.</p><button class="ce-store-context" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3 9l1.5-5h15L21 9M3 9h18M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0M5 12v9h14v-9M10 21v-5h4v5"/></svg><span>Tu tienda: <span class="ce-store-context-name">Tacna</span></span></button></div></div>
  <header class="ce-site-header">
    <div class="ce-container ce-site-header-inner">
      <a class="ce-site-brand" href="#"><img src="../../media/logo-wordmark-color.png" alt="Casa Elida, inicio" width="99" height="44"></a>
      <nav class="ce-site-nav" aria-label="Principal"><ul><li><a href="#" aria-current="page">Productos</a></li><li><a href="#">Ambientes</a></li><li><a href="#">Ofertas</a></li><li><a href="#">Tiendas</a></li><li><a href="#">Ayuda</a></li></ul></nav>
      <form class="ce-search" role="search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m21 21-5-5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg><label class="ce-sr-only" for="q">Buscar productos</label><input id="q" type="search" placeholder="¿Qué estás buscando?"></form>
      <div class="ce-site-actions">
        <a class="ce-site-action" href="#"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-8 9a8 8 0 0 1 16 0"/></svg><span class="ce-site-action-label">Hola, inicia sesión</span></a>
        <a class="ce-site-action" href="#" aria-label="Favoritos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg></a>
        <a class="ce-site-action" href="#" aria-label="Bolsa, 3 productos"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 7h14l1 14H4L5 7Zm3 0V5a4 4 0 0 1 8 0v2"/></svg><span class="ce-count" aria-hidden="true">3</span></a>
        <button class="ce-site-action ce-site-menu" type="button" aria-label="Abrir menú"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </div>
    </div>
  </header>
</div>
</body>
</html>
