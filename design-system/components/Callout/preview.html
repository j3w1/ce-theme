<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Callout</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .stage-callout { display: flex; flex-wrap: wrap; gap: var(--ce-space-24); padding: var(--ce-space-64) var(--ce-space-24) var(--ce-space-24); background: var(--ce-color-surface-subtle); }
  .ce-callout { width: 400px; max-width: 100%; }
</style>
</head>
<body>
<div class="ce-scope stage-callout">
  <article class="ce-callout">
    <img src="../../media/product-nome.png" alt="NOME Taza de Vidrio" width="300" height="300">
    <div>
      <span class="ce-code">CE2606<span class="ce-code-number">1440</span></span>
      <h3 class="ce-product-heading"><span class="ce-product-name">NOME</span><span class="ce-product-description">Taza de Vidrio</span></h3>
      <p class="ce-product-specs">vidrio borosilicato, 350ml</p>
      <div class="ce-price-block"><span class="ce-price ce-price--regular"><span class="ce-sr-only">Precio actual: 8 soles, cada una</span><span class="ce-price-amount"><span class="ce-price-currency" aria-hidden="true">S/</span><span class="ce-price-value" aria-hidden="true">8</span></span><span class="ce-price-unit" aria-hidden="true">cada una</span></span></div>
    </div>
  </article>
  <article class="ce-callout ce-callout--bubble">
    <img src="../../media/product-mene.png" alt="MENE Taza de Vidrio" width="300" height="300">
    <div>
      <h3 class="ce-product-heading"><span class="ce-product-name">MENE</span><span class="ce-product-description">Taza de Vidrio</span></h3>
      <dl class="ce-specs">
        <div class="ce-spec"><dt><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 17 14-14 4 4L7 21 3 17ZM8 12l2 2m2-6 2 2m2-6 2 2"/></svg><span class="ce-sr-only">Medida</span></dt><dd>250ml</dd></div>
        <div class="ce-spec"><dt><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M9 7.5 14 2.5l2 2-1 1 4 4 1.5-1.5 1.5 1.5-4 4-1.5-1.5 1.5-1.5-4-4-1 1-2-2ZM11 9.5l-8 8a1.4 1.4 0 0 0 2 2l8-8"/></svg><span class="ce-sr-only">Material</span></dt><dd>vidrio borosilicato</dd></div>
      </dl>
      <div class="ce-price-block"><span class="ce-price ce-price--regular"><span class="ce-sr-only">Precio actual: 6.5 soles</span><span class="ce-price-amount"><span class="ce-price-currency" aria-hidden="true">S/</span><span class="ce-price-value" aria-hidden="true">6.5</span></span></span></div>
    </div>
  </article>
</div>
</body>
</html>
