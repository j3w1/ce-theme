<!-- @dsCard group="Retail discovery" height=360 width=1200 -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>FilterBar</title>
<style>
  body { margin: 0; background: var(--ce-color-surface-canvas); }
  .wrap { padding: var(--ce-space-16); }
</style>
</head>
<body>
<div class="ce-scope wrap">
  <div class="ce-listing">
    <aside class="ce-listing-aside" aria-label="Filtros"><details class="ce-disclosure" open><summary>Categoría</summary><div class="ce-disclosure-body"><ul class="ce-option-list"><li><label class="ce-check"><input type="checkbox">Tazas y vasos<span class="ce-option-count">2</span></label></li><li><label class="ce-check"><input type="checkbox">Tapetes<span class="ce-option-count">2</span></label></li></ul></div></details><details class="ce-disclosure"><summary>Material</summary><div class="ce-disclosure-body"><ul class="ce-option-list"><li><label class="ce-check"><input type="checkbox">vidrio borosilicato<span class="ce-option-count">2</span></label></li><li><label class="ce-check"><input type="checkbox">PVC<span class="ce-option-count">2</span></label></li></ul></div></details><details class="ce-disclosure"><summary>Disponibilidad</summary><div class="ce-disclosure-body"><ul class="ce-option-list"><li><label class="ce-check"><input type="checkbox">Disponible en tu tienda<span class="ce-option-count">3</span></label></li></ul></div></details></aside>
    <div>
      <div class="ce-filter-bar">
        <div class="ce-filter-chips" role="group" aria-label="Filtros rápidos">
          <button class="ce-chip" type="button" data-ce-filters><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h9m4 0h3M4 17h3m4 0h9M15 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4ZM9 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></svg>Filtros<span class="ce-chip-count">1</span></button>
          <button class="ce-chip" type="button">Ordenar<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></button>
          <button class="ce-chip" type="button" aria-pressed="true">Disponible en tu tienda</button>
          <button class="ce-chip" type="button" aria-pressed="false">Nuevos</button>
          <button class="ce-chip" type="button" aria-pressed="false">En oferta</button>
        </div>
        <p class="ce-result-count" role="status">4 productos</p>
      </div>
      <ul class="ce-active-filters" aria-label="Filtros activos"><li class="ce-token">Disponible en tu tienda<button type="button" aria-label="Quitar filtro: disponible en tu tienda"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M6 18 18 6"/></svg></button></li></ul>
      <div class="ce-load-more"><p>Mostrando 4 de 4 productos</p><progress class="ce-progress" max="4" value="4" aria-label="Productos mostrados">4 de 4</progress></div>
    </div>
  </div>
</div>
</body>
</html>
